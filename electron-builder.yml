appId: se.lucasskog.listan
productName: listan
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!e2e/**'
  - '!scripts/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# electron-updater reads its feed from app-update.yml, generated by
# electron-builder from this publish config; the tagged release build writes
# latest.yml + .blockmap next to the installer for the updater to consume.
publish:
  provider: github
  owner: sockulags
  repo: listan
win:
  executableName: listan
# No code signing. The installer is unsigned, so SmartScreen will warn on first
# run until a CA-issued certificate is in place.
nsis:
  # Version-less artifact name so a /releases/latest/download/ link never rots.
  # The version lives in the release tag and latest.yml.
  artifactName: listan-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  runAfterFinish: true
npmRebuild: false
